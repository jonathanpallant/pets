[build]
target = ["thumbv7em-none-eabi"]

#
# These targets need an MPS2 machine loaded with the AN386 image (Cortex-M4F)
#

[target.thumbv6m-none-eabi]
rustflags = [
    "-Clink-arg=-Tlink.x",
    "-Clink-arg=-Tdefmt.x",
]
runner = ["qemu-run", "--cpu=cortex-m4", "--machine=mps2-an386", "--log-format={t} {[{L}]%bold} {s} {({ff}:{l:1})%dimmed}"]

[target.thumbv7m-none-eabi]
rustflags = [
    "-Clink-arg=-Tlink.x",
    "-Clink-arg=-Tdefmt.x",
]
runner = ["qemu-run", "--cpu=cortex-m4", "--machine=mps2-an386", "--log-format={t} {[{L}]%bold} {s} {({ff}:{l:1})%dimmed}"]

[target.thumbv7em-none-eabi]
rustflags = [
    "-Clink-arg=-Tlink.x",
    "-Clink-arg=-Tdefmt.x",
]
runner = ["qemu-run", "--cpu=cortex-m4", "--machine=mps2-an386", "--log-format={t} {[{L}]%bold} {s} {({ff}:{l:1})%dimmed}"]

[target.thumbv7em-none-eabihf]
rustflags = [
    "-Clink-arg=-Tlink.x",
    "-Clink-arg=-Tdefmt.x",
]
runner = ["qemu-run", "--cpu=cortex-m4", "--machine=mps2-an386", "--log-format={t} {[{L}]%bold} {s} {({ff}:{l:1})%dimmed}"]

#
# These targets need an MPS2-TZ machine loaded with the AN505 image (Cortex-M33)
#

[target.thumbv8m.base-none-eabi]
rustflags = [
    "-Clink-arg=-Tlink.x",
    "-Clink-arg=-Tdefmt.x",
]
runner = ["qemu-run", "--cpu=cortex-m33", "--machine=mps2-an505", "--log-format={t} {[{L}]%bold} {s} {({ff}:{l:1})%dimmed}"]

[target.thumbv8m.main-none-eabi]
rustflags = [
    "-Clink-arg=-Tlink.x",
    "-Clink-arg=-Tdefmt.x",
]
runner = ["qemu-run", "--cpu=cortex-m33", "--machine=mps2-an505", "--log-format={t} {[{L}]%bold} {s} {({ff}:{l:1})%dimmed}"]

[target.thumbv8m.main-none-eabihf]
rustflags = [
    "-Clink-arg=-Tlink.x",
    "-Clink-arg=-Tdefmt.x",
]
runner = ["qemu-run", "--cpu=cortex-m33", "--machine=mps2-an505", "--log-format={t} {[{L}]%bold} {s} {({ff}:{l:1})%dimmed}"]

[env]
DEFMT_LOG="debug"
